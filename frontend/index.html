<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Without this, mobile browsers render at ~980px and zoom out, which made
         every responsive breakpoint in the app dead on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f5" />

    <title>Crypto Pilot - Live crypto trading, order book and AI copilot</title>
    <meta
      name="description"
      content="Trade BTC, ETH, SOL and BNB against a live order book. Real-time prices over websocket, market and limit orders, portfolio tracking, and an AI assistant that reads your positions."
    />

    <!-- Inline SVG favicon: no extra request, works on light and dark tabs.
         Replaces four PNG references that did not exist and returned 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23201d18'/%3E%3Cpath d='M11 8h6.2c3 0 4.8 1.5 4.8 4 0 1.7-.9 2.9-2.3 3.4 1.8.4 2.9 1.8 2.9 3.7 0 2.8-2 4.4-5.3 4.4H11V8Zm3.2 6.3h2.4c1.3 0 2.1-.7 2.1-1.8s-.8-1.7-2.1-1.7h-2.4v3.5Zm0 6.5h2.7c1.4 0 2.3-.7 2.3-1.9s-.9-1.9-2.3-1.9h-2.7v3.8Z' fill='%23fff'/%3E%3Cpath d='M15.1 5.5h1.6v3h-1.6zM15.1 23.5h1.6v3h-1.6z' fill='%23fff'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />

    <!-- Fonts are self-hosted via @fontsource in src/index.css. No render
         blocking request to a third party on first paint. -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Crypto Pilot" />
    <meta
      property="og:description"
      content="Live crypto trading with a real matching engine, streaming prices, and an AI copilot."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
